[project]
name = "evidencerank"
version = "0.1.0"
description = "Evidence-grounded multi-agent LLM candidate ranking pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "sentence-transformers>=3.0",
    "rapidfuzz>=3.9",
    "click>=8.1",
    "scipy>=1.13",
    "numpy>=1.26",
    "python-dotenv>=1.2.2",
]

[project.scripts]
evidencerank = "evidencerank.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "fpdf2>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidencerank", "evaluation"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evaluation"]
